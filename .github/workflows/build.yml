name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas del lector de SMS y compilar
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew testReleaseUnitTest assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Resumen de errores
        if: failure()
        run: |
          ERR=$( (grep -E '^e: |FAILED|expected:|Exception|What went wrong' -A3 build.log || tail -60 build.log) | head -120 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Errores de compilacion::$ERR"

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk finanzas.apk

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Finanzas v1.0.${{ github.run_number }}
          files: finanzas.apk
          make_latest: true
